[project]
name = "disapptrks-nano"
version = "0.1.0"
description = "PocketCoffea analysis for the Run 3 disappearing-track search"
readme = "README.md"
requires-python = ">=3.9"
authors = [ { name = "Joyce" } ]

[project.scripts]
disapptrks = "disapptrks.cli:main"

[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
analysis = [
  "awkward>=1.10.3,<2",
  "coffea==0.7.29",
  "hist>=2.8.0",
  "numpy>=1.22.0",
  "scipy>=1.8.0",
  "uproot>=4,<5",
  "vector<1.5.0",
  "xrootd>=5,<6",
]
pocket-coffea = [
  "pocket-coffea==0.9.12",
]
test = ["pytest", "numpy>=1.22.0", "scipy>=1.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
